<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AltParts Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="h3 mb-3">Alternative Part Number Finder</h1>
              <p class="text-muted">Enter an electronic component part number to search the web for likely equivalents and alternatives.</p>
              {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
              {% endif %}
              <form method="post">
                <div class="mb-3">
                  <label for="part_number" class="form-label">Part number</label>
                  <input type="text" class="form-control" id="part_number" name="part_number" placeholder="e.g. LM358, 2N2222, IRFZ44N" required>
                </div>
                <div class="d-grid gap-2 d-sm-flex">
                  <button type="submit" class="btn btn-primary">Find Alternatives</button>
                </div>
              </form>
            </div>
          </div>
          <p class="text-center text-muted mt-3 small">Results are heuristic and may contain errors. Always verify with datasheets.</p>
        </div>
      </div>
    </div>
  </body>
</html>
